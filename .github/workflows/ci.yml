name: CI/CD

on: [push, pull_request]

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install deps
        run: poetry install
      - name: Black
        run: poetry run black --check .
      - name: isort
        run: poetry run isort --check .
      - name: pylint
        run: poetry run pylint bsort
      - name: pytest
        run: poetry run pytest

  build-docker:
    needs: test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker
        run: docker build -t bsort:latest .