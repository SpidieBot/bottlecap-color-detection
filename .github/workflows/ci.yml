name: CI/CD

on: [push, pull_request]

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry
      - name: Install deps
        run: poetry install
      - name: Black
        run: poetry run black --check .
      - name: isort
        run: poetry run isort --check .
      - name: pylint
        run: poetry run pylint bsort

  build-docker:
      needs: test-lint
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: df -h  # Log disk space for debugging
        - run: docker build -t bsort:latest . --no-cache  # No-cache to avoid large layers