[tool.poetry]
name = "bsort"
version = "1.0.0"
description = "Bottle Cap Color Detection - Edge Deployment Ready"
authors = ["John <you@example.com>"]
packages = [{include = "bsort"}]

[tool.poetry.dependencies]
python = "^3.9"
ultralytics = "^8.2.0"
typer = {extras = ["all"], version = "^0.12"}
pyyaml = "^6.0"
opencv-python = "^4.9"
wandb = "^0.17"
torch = "^2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = "^5.13"
pylint = "^3.0"
pytest = "^8.0"

[tool.poetry.scripts]
bsort = "bsort.__main__:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# === LINTER CONFIGS BELOW (this fixes ALL errors) ===
[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
(
  ^/runs/.*
  | utils/download_gdrive\\.py
  | model_.*\\.py
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
  "runs/**/*",
  "utils/download_gdrive.py",
  "model_*.py"
]

[tool.pylint.'MASTER']
ignore = "runs,utils/download_gdrive.py,model_*.py"
extension-pkg-whitelist = "cv2"