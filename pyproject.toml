[tool.poetry]
name = "bsort"
version = "1.0.0"
description = "Real-time bottle cap color detection for edge deployment"
authors = ["John <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
ultralytics = "^8.2.0"
typer = {extras = ["all"], version = "^0.12"}
pyyaml = "^6.0"
opencv-python = "^4.9"
wandb = "^0.17"
torch = "^2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = "^5.13"
pylint = "^3.0"
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"